
image: node:20-alpine

stages:
  - validation
  - test
  - build

.api_job_template: &api_job_template
  cache:
    key:
      files:
        - api/package-lock.json
    paths:
      - api/.npm/
  rules:
    - changes:
        - api/**/*
        - .gitlab-ci.yml

.front_job_template: &front_job_template
  cache:
    key:
      files:
        - front/package-lock.json
    paths:
      - front/.npm/
  rules:
    - changes:
        - front/**/*
        - .gitlab-ci.yml

lint-api:
  <<: *api_job_template
  stage: validation
  script:
    - echo "🚀 Démarrage de la validation API..."
    - cd api
    - npm ci --cache .npm --prefer-offline
    - npm run lint:check

test-api:
  <<: *api_job_template
  stage: test
  script:
    - echo "🧪 Démarrage des tests API..."
    - cd api
    - npm ci --cache .npm --prefer-offline
    - npm test

lint-front:
  <<: *front_job_template
  stage: validation
  script:
    - echo "🎨 Démarrage de la validation Front..."
    - cd front
    - npm ci --cache .npm --prefer-offline
    - npm run lint:check
    - npm run format:check

test-front:
  <<: *front_job_template
  stage: test
  script:
    - echo "🧪 Démarrage des tests Front..."
    - cd front
    - npm ci --cache .npm --prefer-offline
    - npm test

test-e2e:
  <<: *front_job_template
  stage: test
  # On utilise l'image qui contient déjà les navigateurs
  image: mcr.microsoft.com/playwright:v1.49.1-jammy
  script:
    - echo "🧪 Démarrage des tests E2E..."
    - cd front
    - npm ci --cache .npm --prefer-offline
    - npx playwright install --with-deps
    - npm run test:e2e
  artifacts:
    when: always
    paths:
      - front/playwright-report/
    expire_in: 1 week


.build_template:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "🐳 Construction de l'image $APP_NAME..."
    - docker build -t $IMAGE_NAME:$CI_COMMIT_SHORT_SHA -t $IMAGE_NAME:latest $CONTEXT_DIR/
    - echo "⬆️ Envoi vers le registre..."
    - docker push $IMAGE_NAME --all-tags

build-api:
  extends: .build_template
  variables:
    APP_NAME: "API"
    IMAGE_NAME: $CI_REGISTRY_IMAGE/api  
    CONTEXT_DIR: api                    
  rules:
    - changes: [api/**/*, .gitlab-ci.yml]

build-front:
  extends: .build_template
  variables:
    APP_NAME: "Front"
    IMAGE_NAME: $CI_REGISTRY_IMAGE/front 
    CONTEXT_DIR: front                   
  rules:
    - changes: [front/**/*, .gitlab-ci.yml]