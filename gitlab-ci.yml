
image: node:20-alpine

stages:
  - validation
  - test

lint-api:
  stage: validation
  cache:
    key:
      files:
        - api/package-lock.json
    paths:
      - api/.npm/
  script:
    - echo "🚀 Démarrage de la validation API..."
    - cd api
    - npm ci --cache .npm --prefer-offline
    - npm run lint:check
  rules:
    - changes:
        - api/**/*
        - .gitlab-ci.yml

test-api:
  stage: test
  cache:
    key:
      files:
        - api/package-lock.json
    paths:
      - api/.npm/
  script:
    - echo "🧪 Démarrage des tests API..."
    - cd api
    - npm ci --cache .npm --prefer-offline
    - npm test
  rules:
    - changes:
        - api/**/*
        - .gitlab-ci.yml

lint-front:
  stage: validation
  cache:
    key:
      files:
        - front/package-lock.json
    paths:
      - front/.npm/
  script:
    - echo "🎨 Démarrage de la validation Front..."
    - cd front
    - npm ci --cache .npm --prefer-offline
    - npm run lint:check
    - npm run format:check
  rules:
    - changes:
        - front/**/*
        - .gitlab-ci.yml

test-front:
  stage: test
  cache:
    key:
      files:
        - front/package-lock.json
    paths:
      - front/.npm/
  script:
    - echo "🧪 Démarrage des tests Front..."
    - cd front
    - npm ci --cache .npm --prefer-offline
    - npm test
  rules:
    - changes:
        - front/**/*
        - .gitlab-ci.yml